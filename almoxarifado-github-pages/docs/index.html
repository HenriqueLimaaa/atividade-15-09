<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Almoxarifado — Gestão de Estoque</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" class="screen"><div class="login-card">
<div class="logo">📦</div><h1>Almoxarifado</h1><p>Gestão de estoque</p>
<form id="loginForm"><input id="usuario" placeholder="Usuário" required><input id="senha" type="password" placeholder="Senha" required>
<button>Entrar</button><small>Demo: admin / 1234</small><div id="loginMsg"></div></form>
</div></div>
<div id="app" class="hidden">
<aside><div class="brand">📦 <b>Almoxarifado</b></div>
<nav><button data-page="dashboard">Visão geral</button><button data-page="produtos">Produtos</button><button data-page="estoque">Gestão de estoque</button><button data-page="historico">Histórico</button></nav>
<button id="logout" class="logout">Sair</button></aside>
<main><header><div><span id="pageTitle">Visão geral</span><h2 id="welcome">Olá!</h2></div><div class="user">👤 <span id="userName"></span></div></header><section id="content"></section></main>
</div>
<div id="modal" class="modal hidden"><div class="modal-box"><button class="close" onclick="closeModal()">×</button><h3 id="modalTitle">Produto</h3>
<form id="productForm"><input type="hidden" id="pid"><label>Código<input id="codigo" required></label><label>Nome<input id="nome" required></label><label>Categoria<input id="categoria" required></label><label>Unidade<input id="unidade" required value="un"></label><label>Estoque atual<input id="atual" type="number" min="0" required></label><label>Estoque mínimo<input id="minimo" type="number" min="0" required></label><button>Salvar produto</button></form>
</div></div>
<script src="app.js"></script>
</body></html>
